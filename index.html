<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %PORTFOLIO_*% placeholders are filled from the Excel data at build time (scripts/vite-plugin-portfolio.js) -->
    <title>%PORTFOLIO_TITLE%</title>
    <meta name="description" content="%PORTFOLIO_DESCRIPTION%" />
    <meta name="author" content="%PORTFOLIO_NAME%" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PORTFOLIO_TITLE%" />
    <meta property="og:description" content="%PORTFOLIO_DESCRIPTION%" />
    <meta property="og:site_name" content="%PORTFOLIO_NAME%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%PORTFOLIO_TITLE%" />
    <meta name="twitter:description" content="%PORTFOLIO_DESCRIPTION%" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript enabled to display.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
